name: tests

# 这个仓库以前一个自动化测试都没有：效果全靠"日常使用观察"，
# 于是 LOOP_MAX 未定义、rollup 不删源文件丢内容、pet 的 read_history 不存在
# 这类问题都只能等出事了才发现。现在至少纯逻辑那部分有回归网了。

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    name: 单元测试（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 跑测试
        run: python -m unittest discover -s tests -t tests -v

  syntax:
    name: 全仓语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # compileall 只编译不执行，所以不需要装 PyQt6 / psutil / fastembed 也能
      # 把桌宠与客户端的语法一起兜住（测试路径 import 不到那些文件）。
      - name: 编译 brain/ 与 pet/ 下所有模块
        run: |
          python -m compileall -q brain pet
          echo "compileall OK"
